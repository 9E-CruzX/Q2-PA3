<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSS Tables and Images</title>

    <link rel="stylesheet" href="style.css">

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
    <div class="container">
        <h1 class="text-primary text-center">BS5 Tables and Images</h1>
    
    <table class="table table-hover table-bordered table-striped">
        <!-- table header -->
    <thead>
        <tr class="table-dark text-center">
            <th>PROFILE</th>
            <th>NAME</th>
            <th>BIRTHDAY</th>
        </tr>
    </thead>

    <tbody>
        <!-- Record 1 -->
        <tr class="table-info text-center">
            <td><img class=rounded src="https://static.wikia.nocookie.net/disney/images/0/03/Profile_-_Winnie_the_Pooh.png/revision/latest/thumbnail/width/360/height/360?cb=20250323022729" alt=""></td>
            <td>Zhaimer Eyhsan Rodriguez Mamacotao</td>
            <td>October 12, 2012</td>
        </tr>

        <!-- Record 2 -->
        <tr class="table-warning text-center">
            <td><img class=rounded-circle src="https://i.pinimg.com/736x/4a/b0/cf/4ab0cf1f89af83d5e0c181fda5061a45.jpg" alt=""></td>
            <td>Arkin Matthew Santos Alcala</td>
            <td>November 30, 2012</td>
        </tr>

        <!-- Record 3 -->
        <tr class="table-success text-center">
            <td><img class=rounded-circle src="https://img.magnific.com/premium-vector/dancing-skeleton-illustration_654468-889.jpg?semt=ais_hybrid&w=740&q=80" alt=""></td>
            <td>Isaac Nathaniel Magpoc Arias</td>
            <td>August 23, 2012</td>
        </tr>

        <!-- Record 4 -->
        <tr class="table-danger text-center">
            <td><img class=rounded-circle src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiEqHjdab0uZTqLyFOC3wBFLeza_Vq3zbjVfCmqROGEQ&s=10" alt=""></td>
            <td>Sean Conrad Cortez Militante</td>
            <td>January 12, 2012</td>
        </tr>

        <!-- Record 5 -->
        <tr class="table-primary text-center">
            <!-- img class options: rounded, rounded-circle, img-thumbnail -->
            <td><img class=rounded-circle src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0RQ6UVbleS5CEIYz3kuSFVw1cSnnGO_Y5DNj0TrSLs4V8PEnIkAEYfOw&s=10" alt=""></td>
            <td>Sancho Vitto Pantilliano Mejia</td>
            <td>August 20, 2012</td>
        </tr>
    </table>
</div>

</body>
</html>
